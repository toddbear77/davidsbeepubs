name: Daily update

on:
  schedule:
    - cron: "15 10 * * *"   # every day at 10:15 UTC (6:15 am Eastern in summer, 5:15 am in winter)
  workflow_dispatch:         # adds a "Run workflow" button for running it by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the Babylon Bee and refresh headlines.json
        run: python3 scripts/update.py

      - name: Save changes (Netlify republishes automatically)
        run: |
          git config user.name "daily-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/headlines.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git push
          fi
